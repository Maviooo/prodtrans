[project]
name = "prodtrans"
version = "0.1.0"
description = "Transkrypcja po polsku na żywo z wielu kanałów audio (Dante), lokalnie na Macu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "parakeet-mlx>=0.6.0",
    "scipy>=1.18.1",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
prodtrans = "prodtrans:main"

[project.optional-dependencies]
qwen = [
    "qwen-asr>=0.0.6",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["slow: wymaga pobrania modelu (uruchamiaj z -m slow)"]
filterwarnings = ["ignore::UserWarning"]
